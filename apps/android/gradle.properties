org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# AGP 8.9's Android JDK image transform is not configuration-cache safe on every JDK vendor.
# This app is small enough that predictable IDE/debug builds are more valuable than caching here.
org.gradle.configuration-cache=false
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
